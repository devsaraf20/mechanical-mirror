; Optional: build with PlatformIO instead of the Arduino IDE.
;   cd firmware/esp32-mirror && pio run -t upload && pio device monitor
[platformio]
src_dir = .

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
  adafruit/Adafruit PWM Servo Driver Library@^3.0.2
  links2004/WebSockets@^2.6.1
