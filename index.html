<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mechanical Mirror</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="sim"></div>
    <aside id="hud">
      <header>
        <h1>Mechanical Mirror</h1>
        <span id="source-badge" class="badge">synthetic</span>
      </header>
      <div class="previews">
        <figure><canvas id="pv-input" width="160" height="160"></canvas><figcaption>input</figcaption></figure>
        <figure><canvas id="pv-grid" width="160" height="160"></canvas><figcaption>brightness</figcaption></figure>
        <figure><canvas id="pv-angle" width="160" height="160"></canvas><figcaption>servo angle</figcaption></figure>
      </div>
      <dl id="stats"></dl>
      <p id="message" class="message" hidden></p>
    </aside>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
